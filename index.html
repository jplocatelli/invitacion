<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra boda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="./app.css" rel="stylesheet">
</head>
<body class="bg-[url(./assets/back.webp)] bg-fixed bg-center font-sans">

  <section class="min-h-screen absolute top-0 left-0 right-0 bottom-0">
    <div class="fixed left-0 top-0"></div>
    <div class="fixed right-0 top-0"></div>
    <div class="fixed left-0 bottom-0"></div>
    <div class="fixed right-0 bottom-0"></div>
  </section>

  <!-- Sección 1: Portada -->
  <section class="min-h-screen flex flex-col justify-center items-center" data-aos="fade-up">
    <h1 class="text-4xl md:text-6xl font-bold text-white drop-shadow-lg mb-4">Loli & Pablo</h1>
    <p class="text-lg md:text-2xl text-white mb-8">¡Nos casamos!</p>
    <img src="fondo.png" alt="Invitación" class="w-4/5 md:w-2/5 rounded-lg shadow-xl">
  </section>

  <!-- Sección 2: Confirmación de asistencia -->
  <section class="min-h-screen flex flex-col justify-center items-center" data-aos="fade-left">
    <h2 class="text-3xl md:text-4xl font-bold mb-6">Confirma tu asistencia</h2>
    <a id="confirmar" href="#" class="px-8 py-4 bg-yellow-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-yellow-500 transition mb-4">
      Confirmar asistencia
    </a>
    <a href="https://maps.google.com/?q=TU_DIRECCION" class="px-8 py-4 bg-blue-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-blue-500 transition">
      Cómo llegar
    </a>
  </section>

  <!-- Sección 3: Mapa / Ubicación -->
  <section class="min-h-screen flex justify-center items-center p-4" data-aos="fade-right">
    <div class="w-full max-w-md aspect-[430/607] shadow-xl rounded-xl overflow-hidden">
      <iframe loading="lazy" class="w-full h-full" src="https://www.canva.com/design/DAG7a-Y8a30/qWep1XZR_Vrm7LI2D6VM4w/view?embed" allowfullscreen></iframe>
    </div>
    <p class="mt-4 text-sm text-gray-600">
      <a href="https://www.canva.com/design/DAG7a-Y8a30/qWep1XZR_Vrm7LI2D6VM4w/view?utm_content=DAG7a-Y8a30&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" class="underline text-blue-600">
        Invitación de Pablo Locatelli
      </a>
    </p>
  </section>

  <!-- Sección 4: Mensaje final -->
  <section class="min-h-screen flex flex-col justify-center items-center" data-aos="fade-up">
    <h2 class="text-3xl md:text-5xl font-bold mb-4 text-white drop-shadow-lg">¡Te esperamos!</h2>
    <p class="text-lg md:text-2xl text-white max-w-lg">Gracias por acompañarnos en este momento tan especial. No olvides confirmar tu asistencia.</p>
  </section>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="./app.js"></script>

</body>
</html>
