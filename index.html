<!DOCTYPE html>
<html lang="es" class="overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra boda</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="./app.css" rel="stylesheet">
</head>
<body class="bg-[url(./assets/back.webp)] bg-fixed bg-center overflow-hidden">

  <section class="fixed h-screen w-screen inset-0 pointer-events-none -z-1">
    <!-- Top Left -->
    <div class="top left">
      <div class="-translate-y-51 -translate-x-58 h-[372px] w-[385px] opacity-40">
        <img src="./assets/mancha.webp">
      </div>
      <div class="-translate-x-26 -translate-y-13 h-[187px] w-[314px] -rotate-26">
        <img src="./assets/flores.webp">
      </div>
    </div>

    <!-- Top Right -->
    <div class="top right">
      <div class="-translate-x-2/10 translate-y-1 h-[188px] w-[93px] opacity-75 -rotate-87">
        <img src="./assets/hoja1.png">
      </div>
    </div>

    <!-- Bottom Left -->
    <div class="bottom left">
      <div class="translate-x-0 translate-y-11 h-[178px] w-[102px] opacity-68 rotate-56">
        <img src="./assets/hoja2.png">
      </div>
    </div>

    <!-- Bottom Right -->
    <div class="bottom right">
      <div class="translate-x-4/10 translate-y-2/10 h-[372px] w-[385px] opacity-40">
        <img src="./assets/mancha.webp">
      </div>
      <div class="translate-x-28 translate-y-18 h-[187px] w-[314px] rotate-147">
        <img src="./assets/flores.webp">
      </div>
    </div>
  </section>

  <div class="h-screen scroller overflow-y-scroll">
    <!-- Sección 1: Portada -->
    <section id="first-section" class="relative h-screen w-screen flex flex-col justify-center items-center">
      <div class="absolute top-0 right-0 -translate-x-9 translate-y-11 h-[36px] w-[49px] rotate-15" data-aos="fade-left" data-aos-anchor="#first-section">
        <img src="./assets/mariposa1.png">
      </div>
      <p class="text-base mb-6 font-[Fahkwang] font-light uppercase">¡Nos casamos!</p>
      <h1 class="text-5xl font-[Lovely] mb-4" data-aos-id="primary-text" data-aos="animate-primary">Loli &amp; Pablo</h1>
      <div class="absolute left-0 bottom-0 translate-x-15 -translate-y-35 h-[53px] w-[92px] -rotate-15" data-aos="fade-right" data-aos-anchor="#first-section">
        <img src="./assets/mariposa2.png">
      </div>
    </section>
  
    <!-- Sección 2: Confirmación de asistencia -->
    <section class="h-screen w-screen flex flex-col justify-center items-center">
      <h2 class="text-5xl font-[Lovely] -mb-3 scale-60 aos-init" data-aos-id="primary-text" data-aos="animate-primary">Loli &amp; Pablo</h2>
      <div class="h-[20px] w-[198px]">
        <img src="./assets/anillos.png">
      </div>
      
      <p class="text-lg text-center w-[252px] mt-10 mb-6 font-[Fahkwang] font-light">¡Te invitamos a nuestro casamiento!</p>

      <div class="flex">
        <span class="text-lg text-center font-[Fahkwang] font-light text-uppercase">Febrero</span>
        <div class="">
          <span class="text-lg text-center font-[Fahkwang] font-light text-uppercase">Viernes</span>
          <div class=""></div>
          <span class="text-lg text-center font-[Fahkwang] font-light">6</span>
          <div></div>
          <span class="text-lg text-center font-[Fahkwang] font-light text-uppercase">20:00 HS</span>
        </div>
        <span class="text-lg text-center font-[Fahkwang] font-light">2026</span>
      </div>
    </section>
  
    <!-- Sección 3: Mapa / Ubicación -->
    <section class="h-screen w-screen flex justify-center items-center p-4">
      <div class="w-full max-w-md aspect-[430/607] shadow-xl rounded-xl overflow-hidden">
        <iframe loading="lazy" class="w-full h-full" src="https://www.canva.com/design/DAG7a-Y8a30/qWep1XZR_Vrm7LI2D6VM4w/view?embed" allowfullscreen></iframe>
      </div>
      <p class="mt-4 text-sm text-gray-600">
        <a href="https://www.canva.com/design/DAG7a-Y8a30/qWep1XZR_Vrm7LI2D6VM4w/view?utm_content=DAG7a-Y8a30&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" class="underline text-blue-600">
          Invitación de Pablo Locatelli
        </a>
      </p>
    </section>
  
    <!-- Sección 4: Mensaje final -->
    <section class="h-screen w-screen flex flex-col justify-center items-center">
      <h2 class="text-3xl md:text-5xl font-bold mb-4 drop-shadow-lg">¡Te esperamos!</h2>
      <p class="text-lg md:text-2xl max-w-lg">Gracias por acompañarnos en este momento tan especial. No olvides confirmar tu asistencia.</p>
    </section>
  </div>


  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
  <script src="./app.js"></script>

</body>
</html>
