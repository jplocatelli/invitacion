<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra boda</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    .container {
      max-width: 430px;
      margin: auto;
      background: white;
    }
    img {
      width: 100%;
      display: block;
    }
    .boton {
      display: block;
      margin: 20px;
      padding: 18px;
      background: #c8a24a;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="fondo.png" alt="Invitación">

  <a id="confirmar" class="boton" href="#">
    Confirmar asistencia
  </a>

  <a class="boton" href="https://maps.google.com/?q=TU_DIRECCION">
    Cómo llegar
  </a>
  <div style="position: relative; width: 100%; height: 0; padding-top: 140.9524%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">
  <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
    src="https://www.canva.com/design/DAG7a-Y8a30/qWep1XZR_Vrm7LI2D6VM4w/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>
<a href="https:&#x2F;&#x2F;www.canva.com&#x2F;design&#x2F;DAG7a-Y8a30&#x2F;qWep1XZR_Vrm7LI2D6VM4w&#x2F;view?utm_content=DAG7a-Y8a30&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">Invitacion</a> de Pablo Locatelli
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const invitado = params.get('i');

  const links = {
    "ana-pablo": "https://forms.gle/XXXX",
    "familia-lopez": "https://forms.gle/YYYY"
  };

  if (links[invitado]) {
    document.getElementById("confirmar").href = links[invitado];
  } else {
    document.getElementById("confirmar").style.display = "none";
  }
</script>

</body>
</html>
